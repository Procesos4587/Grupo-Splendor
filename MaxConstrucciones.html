<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de Procesos</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; font-family: Arial, Helvetica, sans-serif; }
  .mapa { position: relative; width: 100%; max-width: 1600px; margin: 0 auto; }
  .mapa-img { display: block; width: 100%; height: auto; }
  .hotspot {
    position: absolute; display: block; margin: 0; border: 0; border-radius: 7px;
    background: transparent; color: transparent; cursor: pointer; padding: 0;
    appearance: none; -webkit-appearance: none; text-align: center;
    font: inherit; text-decoration: none; box-shadow: none;
    /* El área clicable coincide con el recuadro de la imagen; el efecto queda dentro. */
  }
  .hotspot:hover { background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 2px rgba(255,255,255,.9); }
  .hotspot:focus-visible { outline: 3px solid #e6a713; outline-offset: -4px; }
  .home { border-radius: 0; }
  .hint {
    max-width: 1600px; margin: 8px auto 18px; padding: 0 12px;
    color: #555; font-size: 13px; text-align: center;
  }
  @media (max-width: 600px) { .hint { font-size: 12px; } }
</style>

<script>
  /*
   * Agrega las URL reales entre comillas.
   * Ejemplo: "direccionamiento": "https://tu-sitio.sharepoint.com/sites/Procesos/Direccionamiento"
   * La navegación se realizará en la misma pestaña.
   */
  const DESTINOS = {
    "direccionamiento": "",
    "planeacion": "",
    "gestion-humana": "",
    "gestion-comercial": "",
    "proyectos-interventoria": "",
    "proyectos-obra-civil": "",
    "proyectos-inmobiliarios": "",
    "satisfaccion": "",
    "tecnologia-sistemas": "",
    "gestion-legal": "",
    "gestion-financiera": "",
    "suministros-compras": "",
    "inicio": ""
  };

  document.querySelectorAll(".hotspot").forEach((boton) => {
    boton.addEventListener("click", () => {
      const clave = boton.dataset.destino;
      const url = (DESTINOS[clave] || "").trim();
      if (url) {
        window.location.href = url;
      } else {
        const nombre = boton.getAttribute("aria-label") || clave;
        alert('El enlace de "' + nombre + '" está pendiente de configurar.\\n\\nCuando tengas la dirección, agrégala al objeto DESTINOS de este archivo HTML.');
      }
    });
  });
</script>
